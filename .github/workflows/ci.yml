# CI -- the [P2] entry gate (D72).
#
# Cross-platform byte-identity is this harness's central claim, and until this
# workflow ran it was asserted BY CONSTRUCTION only (traceability entry H17).
# Every specific hazard had been pinned individually: shipped output pins LF
# (D49), every text read and write names its encoding and newline (D61, guarded
# over the parsed syntax), the generator staleness digest hashes normalized text
# so a line ending cannot move it (D63), and `git check-attr` reports
# `text: unset` on every dataset input, key and manifest (D27). That is a
# mechanism corroborated, not a result observed -- so D72 makes this workflow the
# GATE into [P2] rather than an item within it. Deferring the verification was
# acceptable; building further on the unverified claim was not.
#
# What this can reach: the DEV SPLIT ONLY. D14 places the entire held-out split
# outside the repository tree, so a clone has no secret tier and no held-out
# inputs. That is the architecture working, not a gap -- and it is exactly why
# the tier-dependent tests must be seen to SKIP here rather than to quietly stop
# existing. A test that vanishes and a test that skips are indistinguishable in a
# green tick, so the skip count is asserted below rather than eyeballed.
#
# On the backslash deny rules. `Bash(*\gen_rules.*)` and its two siblings can
# never match on Linux, so the guard is WEAKER there -- not broken, since the
# space and forward-slash variants still fire, and placement outside the tree is
# the primary control (D14, D30). CI deliberately does nothing about this: the
# shipped `check_guard_configuration` tests coverage substrings and anchoring,
# neither of which is separator-sensitive, so this asymmetry cannot turn the gate
# red. It is recorded as a known, accepted weakening rather than left for a Linux
# run to present as a surprise.

name: CI

on:
  push:
  workflow_dispatch:

# Least privilege, in the repository whose entire subject is withholding reach.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs always report. With fail-fast the second is cancelled the moment
      # the first goes red, which would hide whether a failure is version-specific
      # -- the single most useful thing this matrix exists to tell us.
      fail-fast: false
      matrix:
        # 3.11 is the floor `pyproject.toml` DECLARES and `pyrightconfig.json`
        # targets -- a claim nothing had ever checked, because every verification
        # to date ran on the development machine's 3.14. Running both turns
        # `requires-python` into a verified property and stops the interpreter
        # becoming an unstated dependency of a byte-identity claim, which is D61's
        # rule ("the platform default is never the intended default") generalized
        # past encodings.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report the environment
        shell: bash
        run: |
          python --version
          git --version

      # H17's mechanism, ASSERTED on Linux rather than printed (D81). This step read the
      # attributes and piped them into `uniq -c` for a human to notice, while its own
      # comment said that anything but `text: unset` means a checkout here holds
      # different bytes from a Windows one -- which would move the aggregate inputs
      # digest (D27) and present as tampering. An observation nobody is required to read
      # is not a check.
      - name: Every dataset artifact is exempt from line-ending translation
        shell: bash
        run: |
          files=$(git ls-files 'datasets/*')
          if [ -z "$files" ]; then
            echo "::error::git ls-files matched no dataset artifact, so this check would"
            echo "::error::have passed without examining anything"
            exit 1
          fi
          count=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
          attrs=$(printf '%s\n' "$files" | xargs -n1 git check-attr text -- \
            | sed 's/.*: text: //' | sort -u)
          echo "line-ending attribute across $count dataset artifact(s): $attrs"
          if [ "$attrs" != "unset" ]; then
            echo "::error::expected 'text: unset' on every dataset artifact; found: $attrs."
            echo "::error::A translated artifact holds different bytes on Linux and Windows,"
            echo "::error::which moves the aggregate inputs digest and presents as tampering"
            echo "::error::(D27, H17)"
            exit 1
          fi

      - name: Run the full test suite
        shell: bash
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 | tee suite.log

      - name: The tier-dependent tests skipped rather than vanished
        shell: bash
        run: |
          if ! grep -qE '^Ran [0-9]+ tests' suite.log; then
            echo "::error::the suite produced no run summary at all"
            exit 1
          fi
          ran=$(grep -oE '^Ran [0-9]+ tests' suite.log | grep -oE '[0-9]+' | head -1)

          # DERIVED, not typed (D81). A floor of 150 stood here while the suite held
          # 207, so fifty-seven tests could have stopped running behind a green tick. A
          # floor was the right instinct -- an exact literal would be a second list to
          # keep in step with the suite, the shape D54 condemned -- but the answer is
          # not a looser literal, it is no literal. The traceability map already
          # enumerates every test method in the suite, under a check that fails when the
          # enumeration falls behind, so CI asks that enumeration how many there should
          # be. One list, one owner.
          expected=$(PYTHONPATH=. python -c \
            'from tests.test_traceability import all_test_methods; print(len(all_test_methods()))')
          echo "traceability map enumerates $expected test method(s); the run reports $ran"
          if [ "$ran" != "$expected" ]; then
            echo "::error::$ran tests ran but the traceability map enumerates $expected."
            echo "::error::Either discovery dropped tests -- a green result would then mean"
            echo "::error::nothing was checked -- or the map is stale. Both are failures."
            exit 1
          fi

          # D14 puts the held-out split out of tree, so a clone HAS no secret tier and
          # the tier-dependent tests MUST skip. Zero skips would not mean the suite got
          # stronger -- it would mean those tests stopped running and nothing said so.
          if ! grep -qE '^OK \(.*skipped=[1-9]' suite.log; then
            echo "::error::expected a non-zero skip count: with no secret tier present,"
            echo "::error::the tier-dependent tests must SKIP. Zero skips means they"
            echo "::error::vanished rather than declined to run (D14, D58)"
            exit 1
          fi

          echo "Suite summary:"
          grep -E '^(Ran [0-9]+ tests|OK|FAILED)' suite.log | sed 's/^/  /'
          echo "Skipped, with the reason each gave:"
          grep -E '\.\.\. skipped' suite.log | sed 's/^/  /'

  pyright:
    name: pyright gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `pyrightconfig.json` pins `pythonVersion: 3.11`, so pyright analyses against
      # 3.11 semantics whatever interpreter is present. This step exists so pyright
      # has one to find, not to choose the analysis target.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PINNED on purpose. A bare `npx pyright` resolves to whatever was published
      # that morning, so the type gate could turn red from a pyright release rather
      # than from a change in this repository -- an unstated dependency of exactly
      # the kind D61 named. 1.1.411 is the version that produced the verified
      # "0 errors, 0 warnings" this phase was handed over on; raising it is a
      # deliberate act, and any new diagnostic it brings is then attributable.
      - name: pyright (standard mode, zero errors -- D39)
        shell: bash
        run: npx --yes pyright@1.1.411

  # ---------------------------------------------------------------------------
  # H17, observed rather than argued.
  #
  # "The harness SHALL produce identical scorecard content when run on Windows and
  # on Linux" is this project's central portability claim, and until these two jobs
  # existed it had never been TESTED -- only corroborated, hazard by hazard (D49,
  # D61, D63, D27). Corroborating a mechanism is not observing a result, which is
  # the whole argument D72 made for building CI first.
  #
  # Both legs pin the SAME Python version on purpose. The claim under test is about
  # the platform, so leaving the interpreter free would confound the two: a
  # difference could then be either, and the run could not say which.
  # ---------------------------------------------------------------------------
  scorecard:
    name: scorecard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Score the dev split
        shell: bash
        run: |
          # The findings artifact is DERIVED from the shipped answer key rather than
          # committed, for two reasons. A committed fixture is a second copy of the
          # key's content that can drift from it (D46's lesson), and deriving it means
          # the artifact's own bytes are part of what this compares: if they differed
          # by platform, the findings fingerprint inside the scored body would differ
          # and this job would say so.
          python - <<'PY'
          import json, pathlib
          key = json.loads(
              pathlib.Path("datasets/dev/dev_answer_key.json").read_text(encoding="utf-8")
          )
          findings = [
              {k: e[k] for k in ("status", "category", "scope", "target")}
              for e in key["expected_findings"]
          ]
          pathlib.Path("findings.json").write_text(
              json.dumps({"schema_version": "1", "findings": findings},
                         sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8", newline="\n",
          )
          PY
          PYTHONPATH=src python -m goldset_triad.cli score \
            --dataset dev --findings findings.json --out cards

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ matrix.os }}
          path: cards/
          if-no-files-found: error

  cross-platform:
    name: cross-platform byte-identity (H17)
    needs: [scorecard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: The two platforms produced the same scorecard
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "src")
          # The comparison reuses the SHIPPED definitions -- `deterministic_body` for what
          # two runs must match, and verify's differ for naming where they do not. A second
          # implementation of either could only drift from the one that ships, and drift is
          # the condition this job exists to detect (D58's reasoning, applied here).
          from goldset_triad.scorecard import deterministic_body
          from goldset_triad.verify import _differences

          roots = sorted(p for p in pathlib.Path("downloaded").iterdir() if p.is_dir())
          if len(roots) != 2:
              sys.exit(f"::error::expected two uploaded scorecard sets, found {[r.name for r in roots]}")

          parsed, bodies, summaries = {}, {}, {}
          for root in roots:
              cards = sorted(root.glob("*.json"))
              texts = sorted(root.glob("*.txt"))
              if len(cards) != 1 or len(texts) != 1:
                  sys.exit(f"::error::{root.name}: expected one scorecard pair, found "
                           f"{[p.name for p in cards + texts]}")
              card = json.loads(cards[0].read_text(encoding="utf-8"))
              parsed[root.name] = card
              bodies[root.name] = deterministic_body(card)
              # The human summary too. It references no run_metadata, so it is wholly
              # deterministic -- and D49 claims BOTH halves of the pair carry
              # platform-independent bytes, which is only half-checked if only the JSON is.
              summaries[root.name] = texts[0].read_bytes()

          a, b = roots[0].name, roots[1].name
          failed = False

          if bodies[a] == bodies[b]:
              print(f"scored bodies are byte-identical across {a} and {b} "
                    f"({len(bodies[a])} bytes)")
          else:
              failed = True
              print(f"::error::the scored bodies differ between {a} and {b}")
              body_a = {k: v for k, v in parsed[a].items() if k != "run_metadata"}
              body_b = {k: v for k, v in parsed[b].items() if k != "run_metadata"}
              # Labelled with the PLATFORMS. Verify's default vocabulary is
              # stored/recomputed, which would name the wrong distinction here.
              for line in _differences(body_a, body_b, left=a, right=b)[:20]:
                  print(f"::error::  {line}")

          if summaries[a] == summaries[b]:
              print(f"human summaries are byte-identical too ({len(summaries[a])} bytes)")
          else:
              failed = True
              print(f"::error::the human summaries differ between {a} and {b}; D49 pins LF "
                    f"on both halves of the pair, so this is a byte-level platform difference")

          if failed:
              sys.exit(1)
          print("H17 observed: identical scorecard content outside run_metadata.")
          PY
